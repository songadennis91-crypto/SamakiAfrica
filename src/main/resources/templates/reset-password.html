<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password – SamakiAfrica</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a th:href="@{/}" class="brand-logo">
        <div class="brand-icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.46-3.44 6-7 6s-7.56-2.54-8.5-6Z"/>
            <path d="M18 12v.5"/>
            <path d="M16 17.93a9.77 9.77 0 0 1 0-11.86"/>
            <path d="M7 10.67C7 8 5.58 5.97 2.73 4 3.73 7 4 9 4 12s-.27 5-1.27 8C5.58 18.03 7 16 7 13.33v-2.66Z"/>
          </svg>
        </div>
        <span>Samaki<span class="text-gradient-orange">Africa</span></span>
        <span class="brand-badge">Verification</span>
      </a>

      <div class="nav-actions">
        <a th:href="@{/login}" class="btn btn-glass btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Auth Layout -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 2.75rem; margin-bottom: 0.5rem;">🔒</div>
        <h2>Create New Password</h2>
        <p th:if="${userEmail}">Setting new credentials for <b style="color: var(--text-white);" th:text="${userEmail}">user@samaki.africa</b></p>
      </div>

      <!-- Error Alert -->
      <div class="auth-alert error" th:if="${error}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span th:text="${error}">Token is invalid or expired.</span>
      </div>

      <!-- Password Reset Form -->
      <form th:if="${token != null && (error == null || userEmail != null)}" th:action="@{/reset-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="token" th:value="${token}" />

        <div class="form-group">
          <label class="form-label">New Password <span class="req">*</span></label>
          <input type="password" name="newPassword" class="form-input" placeholder="Minimum 8 characters with letters & numbers" required autofocus>
          <div class="form-helper">Must be at least 8 characters long and combine letters and digits.</div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm New Password <span class="req">*</span></label>
          <input type="password" name="confirmPassword" class="form-input" placeholder="Re-enter new password" required>
        </div>

        <button type="submit" class="btn btn-orange btn-block btn-lg" style="margin-top: 1.5rem;">
          Update & Save New Password
        </button>
      </form>

      <div th:if="${token == null || (error != null && userEmail == null)}" style="text-align: center; margin-top: 1.5rem;">
        <a th:href="@{/forgot-password}" class="btn btn-blue">Request New Recovery Token</a>
      </div>
    </div>
  </main>

</body>
</html>
